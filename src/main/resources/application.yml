spring:
  application:
    name: recovermandate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recovermandate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
server:
  port: ${PORT:8080}
logging:
  level:
    root: INFO
    com.recovermandate: DEBUG
razorpay:
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}
gemini:
  api:
    key: ${GEMINI_API_KEY:}
recovermandate:
  security:
    api-key: ${API_KEY:default-dev-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}