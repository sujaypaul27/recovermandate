spring:
  application:
    name: recovermandate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recovermandate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # NOTE: update is intentional for demo/buildathon environment — would be validate/none in real production with migrations
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
server:
  port: ${PORT:8080}
logging:
  level:
    root: INFO
    com.recovermandate: DEBUG
razorpay:
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}
    replay-window-seconds: ${RAZORPAY_REPLAY_WINDOW:300}
  api:
    key:
      id: ${RAZORPAY_KEY_ID:}
      secret: ${RAZORPAY_KEY_SECRET:}
    base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
gemini:
  api:
    key: ${GEMINI_API_KEY:}
recovermandate:
  security:
    api-key: ${API_KEY:default-dev-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

resilience4j:
  circuitbreaker:
    instances:
      geminiApi:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
  retry:
    instances:
      geminiApi:
        maxAttempts: 3
        waitDuration: 2s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
  timelimiter:
    instances:
      geminiApi:
        timeoutDuration: 10s