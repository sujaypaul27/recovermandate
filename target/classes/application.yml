spring:
  application:
    name: recovermandate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recovermandate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 9
      minimum-idle: 2
      max-lifetime: 180000
      idle-timeout: 120000
      connection-timeout: 30000
      keepalive-time: 60000
      validation-timeout: 5000
  jpa:
    hibernate:
      # NOTE: update is intentional for demo/buildathon environment — would be validate/none in real production with migrations
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
server:
  port: ${PORT:8080}
logging:
  level:
    root: INFO
    com.recovermandate: DEBUG
razorpay:
  dry-run: ${RAZORPAY_DRY_RUN:false}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:${RAZORPAY_SECRET:}}
    replay-window-seconds: ${RAZORPAY_REPLAY_WINDOW:300}
  api:
    key:
      id: ${RAZORPAY_KEY_ID:${RAZORPAY_API_KEY_ID:${RAZORPAY_KEY:}}}
      secret: ${RAZORPAY_KEY_SECRET:${RAZORPAY_API_KEY_SECRET:${RAZORPAY_SECRET:}}}
    key-id: ${RAZORPAY_KEY_ID:${RAZORPAY_API_KEY_ID:${RAZORPAY_KEY:}}}
    key-secret: ${RAZORPAY_KEY_SECRET:${RAZORPAY_API_KEY_SECRET:${RAZORPAY_SECRET:}}}
    base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
gemini:
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  api:
    key: ${GEMINI_API_KEY:}
recovermandate:
  app-url: ${APP_URL:http://localhost:5173}
  security:
    api-key: ${API_KEY:default-dev-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from-email: ${MAIL_FROM:billing@recovermandate.io}
    from-name: ${MAIL_FROM_NAME:RecoverMandate Billing}

resilience4j:
  circuitbreaker:
    instances:
      geminiApi:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
  retry:
    instances:
      geminiApi:
        maxAttempts: 3
        waitDuration: 2s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
  timelimiter:
    instances:
      geminiApi:
        timeoutDuration: 30s